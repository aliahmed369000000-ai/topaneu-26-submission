name: Build TopAneu Task 1 Container

on:
  push:
    branches: [main]
    paths:
      - 'task1/**'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd task1
          docker build -t topaneu-26-task1:latest .

      - name: Save image as tar.gz
        run: |
          docker save topaneu-26-task1:latest | gzip > topaneu-26-task1_$(date +%Y-%m-%d_%H-%M-%S).tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: topaneu-26-task1-image
          path: topaneu-26-task1_*.tar.gz
          retention-days: 14
